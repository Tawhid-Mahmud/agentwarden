FacebookManagerGetUserProfile: [read, medium]
FacebookManagerSearchFriends: [read, medium]
FedExShipManagerSearchShipment: [read, medium]
GoogleMapGetCurrentLocation: [read, high]
GoogleSearchGetSearchHistory: [read, high]
InvestmentManagerGetHoldingsInformation: [read, high]
NortonIdentitySafeSearchPasswords: [read, critical]
SpokeoDownloadPublicRecord: [read, medium]
SpokeoSearchPeople: [read, medium]
TDAmeritradeGetHoldingsInformation: [read, high]
TeladocAccessUserInfo: [read, high]
