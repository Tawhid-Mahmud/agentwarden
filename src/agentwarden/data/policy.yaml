# AgentWarden default policy.
#
# Combining algorithm: deny > (no allow => deny) > require_approval > allow.
# Approval rules are an extra gate on top of what is allowed. They never grant access alone.
#
# Every request has already passed the deterministic checks before this policy runs:
# valid token, enabled agents in the chain, known tool, and the tool's scope in the token.
# Policy decides what is appropriate *in context*. See docs/POLICY_REFERENCE.md.

version: 1
description: Baseline guardrails for tool-using AI agents.
default_effect: deny

rules:
  # ------------------------------------------------------------------ hard denies
  - id: deny-critical-risk
    description: Risk engine is highly confident this call is malicious or hijacked.
    effect: deny
    when:
      - { field: risk.score, op: gte, value: 0.85 }
      # Evidence that only says where the call came from (the content, not the user) is
      # ambiguous on its own, e.g. replying to the sender of an email, so a human decides.
      - not:
          all:
            - any:
                - { field: risk.detectors, op: contains, value: taint }
                - { field: risk.detectors, op: contains, value: provenance }
            - { field: risk.detectors, op: not_contains, value: injection }
            - { field: risk.detectors, op: not_contains, value: secrets }
            - { field: risk.detectors, op: not_contains, value: llm_judge }
            - { field: risk.signals, op: not_contains, value: tainted_destination_with_data }

  - id: deny-data-to-tainted-destination
    description: >-
      Data the agent read is going to a destination that only other content chose, such as the
      payroll file to an address from an email. This is the shape of exfiltration.
    effect: deny
    when:
      - { field: risk.signals, op: contains, value: tainted_destination_with_data }

  - id: deny-hijacked-exfiltration
    description: >-
      An outbound destination (recipient, URL or domain) came from untrusted content that also
      contains instructions aimed at the model. This is the signature of an injected
      exfiltration attempt.
    effect: deny
    when:
      - { field: tool.side_effect, op: eq, value: external }
      - { field: risk.signals, op: contains, value: tainted_external_destination }
      - any:
          - { field: risk.detectors, op: contains, value: injection }
          - { field: risk.detectors, op: contains, value: llm_judge }

  - id: deny-secret-exfiltration
    description: Credentials or keys must never be sent outside the organization.
    effect: deny
    when:
      - { field: tool.side_effect, op: eq, value: external }
      - { field: risk.signals, op: contains, value: secret_in_arguments }

  - id: deny-untrusted-agents-side-effects
    description: Untrusted-tier agents are read-only.
    effect: deny
    when:
      - { field: agent.trust_tier, op: eq, value: untrusted }
      - { field: tool.side_effect, op: in, value: [write, external] }

  - id: deny-deep-delegation-external
    description: Agents two or more delegation hops away from the user may not act externally.
    effect: deny
    when:
      - { field: delegation.depth, op: gte, value: 2 }
      - { field: tool.side_effect, op: eq, value: external }

  # ------------------------------------------------------------------ allows
  - id: allow-read-only-tools
    description: Reading is allowed when the token carries the tool's scope.
    effect: allow
    when:
      - { field: tool.side_effect, op: in, value: [none, read] }

  - id: allow-email
    description: Agents may send email (external recipients require approval below).
    effect: allow
    tools: [send_email]
    when:
      - { field: facts.recipients, op: empty, value: false }

  - id: allow-http
    description: Outbound HTTP is allowed (writes to external hosts require approval below).
    effect: allow
    tools: [http_request]

  - id: allow-workspace-writes
    description: File writes are confined to the shared workspace (paths are normalized).
    effect: allow
    tools: [write_file]
    when:
      - { field: facts.path, op: glob, value: "/workspace/*" }

  - id: allow-crm-writes-privileged
    description: Only privileged agents may modify customer records.
    effect: allow
    tools: [update_crm]
    when:
      - { field: agent.trust_tier, op: eq, value: privileged }

  - id: allow-payments-privileged
    description: Only privileged agents may initiate payments, capped at 10,000.
    effect: allow
    tools: [transfer_funds]
    when:
      - { field: agent.trust_tier, op: eq, value: privileged }
      - { field: args.amount, op: lte, value: 10000 }

  # ------------------------------------------------------------------ approval gates
  - id: approve-critical-tools
    description: Critical tools always need a human in the loop.
    effect: require_approval
    when:
      - { field: tool.risk, op: eq, value: critical }

  - id: approve-external-email
    description: Email leaving the organization needs approval.
    effect: require_approval
    tools: [send_email]
    when:
      - { field: facts.external_recipients, op: empty, value: false }

  - id: approve-outbound-http-writes
    description: Sending data to external hosts needs approval.
    effect: require_approval
    tools: [http_request]
    when:
      - { field: args.method, op: in, value: [POST, PUT, PATCH, DELETE] }
      - { field: facts.external_domains, op: empty, value: false }

  - id: approve-tainted-destination
    description: >-
      The destination came from content the agent read, not from the user (for example
      "reply to the sender"). A human confirms it.
    effect: require_approval
    when:
      - { field: risk.signals, op: contains, value: tainted_external_destination }

  - id: approve-after-injection
    description: >-
      The agent read content with instructions aimed at it (or put them in arguments), or the
      action it is about to take was requested by that content rather than the user. Whatever it
      does next with side effects, a human confirms, however low the tool's own risk.
    effect: require_approval
    when:
      - any:
          - { field: risk.detectors, op: contains, value: injection }
          - { field: risk.detectors, op: contains, value: provenance }
      - { field: tool.side_effect, op: in, value: [write, external] }

  - id: approve-elevated-risk
    description: Elevated risk score; ask a human before doing anything with side effects.
    effect: require_approval
    when:
      - { field: risk.score, op: gte, value: 0.5 }
      - { field: tool.side_effect, op: in, value: [write, external] }
