name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy (strict)
        run: mypy
      - name: Pytest
        run: pytest -W error --cov --cov-report=term-missing --cov-fail-under=90

  postgres:
    name: Tests on PostgreSQL (multi-instance)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container reachable only from this runner: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTWARDEN_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (SQLite and PostgreSQL)
        run: pytest -W error

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pip-audit
      - name: Hidden / bidirectional characters (Trojan Source)
        run: python scripts/check_hidden_chars.py
      - name: Bandit (SAST)
        run: bandit -r src -c pyproject.toml
      - name: Dependency vulnerabilities (advisory)
        run: pip-audit --skip-editable
        continue-on-error: true

  policy-and-detection:
    name: Policy tests, detection quality gate & demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Validate policy
        run: agentwarden policy validate
      - name: Policy-as-code tests
        run: agentwarden policy test tests/policy/default_policy_cases.yaml
      - name: Injection detection quality gate
        run: agentwarden eval --min-recall 0.9 --max-fpr 0.1
      - name: End-to-end attack demo
        run: agentwarden demo --no-color

  benchmark:
    name: Prompt-injection benchmark (BIPIA, InjecAgent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Cache datasets (pinned commits, verified by SHA-256)
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentwarden/benchmarks
          key: benchmark-datasets-${{ hashFiles('src/agentwarden/benchmark/datasets.py') }}
      # Gates sit just under the current results, so a regression fails CI.
      - name: Run benchmark with regression gates
        run: >-
          agentwarden bench --quiet --markdown benchmark.md --json benchmark.json
          --min-recall 0.55 --max-fpr 0.02 --max-asr 0.03 --min-utility 0.99
          --max-false-alarms 0.05
      - name: Publish results
        if: always()
        run: test -f benchmark.md && cat benchmark.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark.*
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agentwarden:ci .
      - name: Smoke test
        run: |
          docker run --rm agentwarden:ci agentwarden version
          docker run -d --name aw -p 8000:8000 agentwarden:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/.well-known/jwks.json
          docker rm -f aw
