[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentwarden"
version = "0.1.0"
description = "Identity & access management for AI agents: delegated scoped tokens, policy-as-code tool authorization, prompt-injection-aware risk scoring, human approvals and a tamper-evident audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Tawhid Mahmud" }]
requires-python = ">=3.11"
keywords = [
  "ai-security",
  "iam",
  "llm-security",
  "prompt-injection",
  "ai-agents",
  "authorization",
  "zero-trust",
  "policy-as-code",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=2.3"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.17.3",
  "mypy>=1.11",
  "bandit>=1.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
agentwarden = "agentwarden.cli:main"

[project.urls]
Homepage = "https://github.com/Tawhid-Mahmud/agentwarden"
Documentation = "https://github.com/Tawhid-Mahmud/agentwarden/tree/main/docs"
Issues = "https://github.com/Tawhid-Mahmud/agentwarden/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["agentwarden"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"examples/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/agentwarden"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
